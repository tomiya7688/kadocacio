name: Windows smoke

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.py"
      - "**/*.bat"
      - "requirements.txt"
      - ".github/workflows/windows-smoke.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.py"
      - "**/*.bat"
      - "requirements.txt"
      - ".github/workflows/windows-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  PYGAME_HIDE_SUPPORT_PROMPT: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q main.py scripts

      - name: Run test suite
        shell: pwsh
        run: python -m pytest -q

      - name: Run static-analysis batch entry point
        shell: cmd
        run: run_static_analysis.bat

      - name: Validate task launcher usage
        shell: cmd
        run: start_task.bat 0 || exit /b 0
