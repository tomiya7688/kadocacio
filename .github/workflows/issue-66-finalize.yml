name: Finalize issue 66

on:
  push:
    branches: ["fix/issue-66-left-offside"]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[issue-66-finalized]') }}
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-66-left-offside
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run pass logic regression tests
        run: python -m pytest -q tests/test_pass_logic.py

      - name: Add version entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("doc/versions.md")
          text = path.read_text(encoding="utf-8")
          marker = "---\n\nver 0.7.1\n"
          lines = [
              "---",
              "",
              "ver 0.7.2",
              "",
              "左右対称のオフサイド判定",
              "",
              "追加したファイル",
              "",
              "- なし",
              "",
              "  既存の試合エンジンとパス判定テストを修正しました。",
              "",
              "変更したファイル",
              "",
              "- `scripts/match/match_engine.py`",
              "",
              "  攻撃方向を考慮した前進量でオフサイド位置を判定し、左向き攻撃でも前方ランナーを正しく検出します。",
              "",
              "- `tests/test_pass_logic.py`",
              "",
              "  左右の鏡像ケース、オフサイドライン上、同位置、自陣の回帰テストを追加しました。",
              "",
              "- `doc/versions.md`",
              "",
              "  ver 0.7.2の変更内容を追記しました。",
              "",
              "---",
              "",
              "ver 0.7.1",
          ]
          entry = "\n".join(lines) + "\n"
          if marker not in text:
              raise SystemExit("version insertion marker not found")
          path.write_text(text.replace(marker, entry, 1), encoding="utf-8")
          PY

      - name: Commit version entry
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/versions.md
          git commit -m "[issue-66-finalized] Document offside symmetry fix"
          git push origin HEAD:fix/issue-66-left-offside
