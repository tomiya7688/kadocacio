name: Apply issue 68 fix

on:
  push:
    branches: ["fix/issue-68-manual-league-errors"]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[issue-68-applied]') }}
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-68-manual-league-errors
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Apply manual error reporting fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          game_path = Path("scripts/app/game_app.py")
          text = game_path.read_text(encoding="utf-8")
          old = '''        self.league_manager.apply_headless_results(session.results)\n        if session.errors and self.league_auto_running:\n            self.stop_league_auto_progress(announce=False)\n            self.league_save_message = "オート進行を停止しました: " + str(session.errors[0])\n        self.league_simulation_session = None\n'''
          new = '''        self.league_manager.apply_headless_results(session.results)\n        if session.errors:\n            details = " / ".join(str(error) for error in session.errors[:2])\n            remaining = len(session.errors) - 2\n            if remaining > 0:\n                details += f" / 他{remaining}件"\n            if self.league_auto_running:\n                self.stop_league_auto_progress(announce=False)\n                prefix = "オート進行を停止しました"\n            else:\n                prefix = "裏試合の処理に失敗しました"\n            self.league_save_message = (\n                f"{prefix}: {details}。"\n                "成功した試合は反映済み、失敗した試合は未消化です"\n            )\n        self.league_simulation_session = None\n'''
          if text.count(old) != 1:
              raise SystemExit("game_app update block not found exactly once")
          game_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          session_path = Path("scripts/league/league_simulation_session.py")
          text = session_path.read_text(encoding="utf-8")
          old = '''            if home_choice is None or away_choice is None:\n                self.completed += 1\n                self.errors.append(str(fixture.get("id", "missing team")))\n                continue\n'''
          new = '''            if home_choice is None or away_choice is None:\n                self.completed += 1\n                fixture_id = str(fixture.get("id", "missing fixture"))\n                self.errors.append(f"{fixture_id}: チームデータが見つかりません")\n                continue\n'''
          if text.count(old) != 1:
              raise SystemExit("session missing-team block not found exactly once")
          session_path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Add regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_league_auto_progress.py")
          text = path.read_text(encoding="utf-8")

          old = '''        self.watch_fixture_id = ""\n        self.last_results = []\n\n    def _fixture_selected(self, fixture: dict) -> bool:\n'''
          new = '''        self.watch_fixture_id = ""\n        self.last_results = []\n        self.applied_results = []\n\n    def _fixture_selected(self, fixture: dict) -> bool:\n'''
          if text.count(old) != 1:
              raise SystemExit("fake manager init marker not found exactly once")
          text = text.replace(old, new, 1)

          old = '''    def save(self) -> None:\n        return None\n\n\nclass LeagueAutoProgressTests(unittest.TestCase):\n'''
          new = '''    def save(self) -> None:\n        return None\n\n    def apply_headless_results(self, results: list[dict]) -> None:\n        self.applied_results = list(results)\n        completed = {str(result.get("fixture_id", "")) for result in results}\n        for fixture in self.fixtures:\n            if str(fixture.get("id", "")) in completed:\n                fixture["played"] = True\n\n\nclass _FinishedLeagueSession:\n    def __init__(self, *, results: list[dict], errors: list[str]) -> None:\n        self.results = list(results)\n        self.errors = list(errors)\n        self.finished = True\n        self.live_updates = False\n        self.live_status = {}\n\n    def poll(self) -> bool:\n        return True\n\n\nclass LeagueAutoProgressTests(unittest.TestCase):\n'''
          if text.count(old) != 1:
              raise SystemExit("fake manager method marker not found exactly once")
          text = text.replace(old, new, 1)

          old = '''        game.league_simulation_session = None\n        game.active_league_fixture_id = ""\n        game.league_save_message = ""\n'''
          new = '''        game.league_simulation_session = None\n        game.league_live_last_status = []\n        game.active_league_fixture_id = ""\n        game.league_save_message = ""\n'''
          if text.count(old) != 1:
              raise SystemExit("game helper marker not found exactly once")
          text = text.replace(old, new, 1)

          marker = '''    def test_watch_none_starts_every_due_match_headlessly(self) -> None:\n'''
          tests = '''    def test_manual_headless_failure_is_reported_and_failed_fixture_stays_unplayed(self) -> None:\n        game = self._game(LeagueAutoProgressConfig(watch_mode=WATCH_NONE))\n        game.league_auto_config_open = False\n        game.league_auto_running = False\n        game.league_simulation_session = _FinishedLeagueSession(\n            results=[{"fixture_id": "m1", "home_score": 2, "away_score": 0}],\n            errors=["m2: worker failed"],\n        )\n\n        game.update_league_simulations()\n\n        fixtures = {fixture["id"]: fixture for fixture in game.league_manager.fixtures}\n        self.assertTrue(fixtures["m1"]["played"])\n        self.assertFalse(fixtures["m2"]["played"])\n        self.assertIn("裏試合の処理に失敗しました", game.league_save_message)\n        self.assertIn("m2", game.league_save_message)\n        self.assertIn("未消化", game.league_save_message)\n        self.assertIsNone(game.league_simulation_session)\n\n    def test_auto_headless_failure_still_stops_auto_progress_and_reports_fixture(self) -> None:\n        game = self._game(LeagueAutoProgressConfig(watch_mode=WATCH_NONE))\n        game.league_auto_config_open = False\n        game.league_auto_running = True\n        game.league_simulation_session = _FinishedLeagueSession(\n            results=[{"fixture_id": "m1", "home_score": 1, "away_score": 1}],\n            errors=["m2: worker failed"],\n        )\n\n        game.update_league_simulations()\n\n        self.assertFalse(game.league_auto_running)\n        self.assertIn("オート進行を停止しました", game.league_save_message)\n        self.assertIn("m2", game.league_save_message)\n        self.assertIn("未消化", game.league_save_message)\n\n'''
          if text.count(marker) != 1:
              raise SystemExit("test insertion marker not found exactly once")
          path.write_text(text.replace(marker, tests + marker, 1), encoding="utf-8")
          PY

      - name: Add version entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("doc/versions.md")
          text = path.read_text(encoding="utf-8")
          marker = "---\n\nver 0.7.3\n"
          lines = [
              "---", "", "ver 0.7.4", "", "手動リーグ進行でも裏試合失敗を通知", "",
              "追加したファイル", "", "- なし", "", "  既存のリーグ進行処理とテストを修正しました。", "",
              "変更したファイル", "", "- `scripts/app/game_app.py`", "",
              "  裏試合workerの失敗を手動進行でも表示し、成功分は反映済み・失敗分は未消化であることを明示します。オート進行時の停止挙動は維持します。", "",
              "- `scripts/league/league_simulation_session.py`", "",
              "  チームデータ欠落エラーにもfixture IDと理由を含めます。", "",
              "- `tests/test_league_auto_progress.py`", "",
              "  手動・オート双方の部分失敗とfixture状態を回帰テストします。", "",
              "- `doc/versions.md`", "", "  ver 0.7.4の変更内容を追記しました。", "", "---", "", "ver 0.7.3", "",
          ]
          entry = "\n".join(lines)
          if text.count(marker) != 1:
              raise SystemExit("version insertion marker not found exactly once")
          path.write_text(text.replace(marker, entry, 1), encoding="utf-8")
          PY

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt pytest

      - name: Run focused regression tests
        run: |
          python -m pytest -q tests/test_league_auto_progress.py tests/test_league_simulation_session.py

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/app/game_app.py scripts/league/league_simulation_session.py tests/test_league_auto_progress.py doc/versions.md
          git commit -m "[issue-68-applied] Report manual league simulation failures"
          git push origin HEAD:fix/issue-68-manual-league-errors
