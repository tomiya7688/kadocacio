name: Fix issue 34 runtime override tests

on:
  push:
    branches: ["feat/issue-34-stable-team-ids"]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[issue-34-ci-fixed]') }}
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-34-stable-team-ids
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Preserve relative-path user override compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/team/team_data.py")
          text = path.read_text(encoding="utf-8")
          old = '''def discover_team_choices() -> list[dict]:\n    choices = []\n    seen_ids: dict[str, Path] = {}\n    roots = [TEAMS_DIR]\n'''
          new = '''def discover_team_choices() -> list[dict]:\n    choices = []\n    seen_ids: dict[str, Path] = {}\n    seen_sources: set[str] = set()\n    roots = [TEAMS_DIR]\n'''
          if text.count(old) != 1:
              raise SystemExit("discover header marker missing")
          text = text.replace(old, new, 1)

          old = '''            config = load_team_config(path, teams_root)\n            if config:\n                team_id = str(config.get("id", ""))\n                previous_root = seen_ids.get(team_id)\n                if previous_root is not None:\n                    if previous_root.resolve() == teams_root.resolve():\n                        raise ValueError(f"Duplicate team ID: {team_id}")\n                    # user_data/teams is scanned first; matching bundled IDs are\n                    # intentional overrides and stay hidden behind the user copy.\n                    continue\n                seen_ids[team_id] = teams_root\n                config.update(\n'''
          new = '''            relative = path.relative_to(teams_root).as_posix()\n            config = load_team_config(path, teams_root)\n            if config:\n                team_id = str(config.get("id", ""))\n                previous_root = seen_ids.get(team_id)\n                if previous_root is not None:\n                    if previous_root.resolve() == teams_root.resolve():\n                        raise ValueError(f"Duplicate team ID: {team_id}")\n                    # user_data/teams is scanned first; matching bundled IDs are\n                    # intentional overrides and stay hidden behind the user copy.\n                    continue\n                # Preserve the pre-stable-ID override contract too: a user team\n                # at the same relative path hides the bundled copy even when an\n                # independently-created file carries a different persistent ID.\n                if relative in seen_sources:\n                    continue\n                seen_ids[team_id] = teams_root\n                seen_sources.add(relative)\n                config.update(\n'''
          if text.count(old) != 1:
              raise SystemExit("discover body marker missing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Update runtime path regression expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_runtime_paths.py")
          text = path.read_text(encoding="utf-8")
          old = '''def _write_team(root: Path, relative: str, name: str) -> None:\n    payload = create_team_template("initial")\n    payload["チーム情報"]["チーム名"] = name\n    target = root / relative\n    target.parent.mkdir(parents=True, exist_ok=True)\n    target.write_text(json.dumps(payload, ensure_ascii=False), encoding="utf-8")\n'''
          new = '''def _write_team(root: Path, relative: str, name: str) -> str:\n    payload = create_team_template("initial")\n    payload["チーム情報"]["チーム名"] = name\n    target = root / relative\n    target.parent.mkdir(parents=True, exist_ok=True)\n    target.write_text(json.dumps(payload, ensure_ascii=False), encoding="utf-8")\n    return str(payload["チームID"])\n'''
          if text.count(old) != 1:
              raise SystemExit("write team helper marker missing")
          text = text.replace(old, new, 1)

          old = '''    _write_team(default_root, "league/sample.json", "標準チーム")\n    _write_team(user_root, "league/sample.json", "ユーザー編集チーム")\n'''
          new = '''    _write_team(default_root, "league/sample.json", "標準チーム")\n    user_id = _write_team(user_root, "league/sample.json", "ユーザー編集チーム")\n'''
          if text.count(old) != 1:
              raise SystemExit("override setup marker missing")
          text = text.replace(old, new, 1)
          text = text.replace(
              '    assert [choice["id"] for choice in choices] == ["json:league/sample.json"]\n',
              '    assert [choice["id"] for choice in choices] == [user_id]\n',
              1,
          )

          old = '''    _write_team(default_root, "sample.json", "標準チーム")\n    user_root.mkdir(parents=True)\n'''
          new = '''    bundled_id = _write_team(default_root, "sample.json", "標準チーム")\n    user_root.mkdir(parents=True)\n'''
          if text.count(old) != 1:
              raise SystemExit("fallback setup marker missing")
          text = text.replace(old, new, 1)
          text = text.replace(
              '    assert [choice["id"] for choice in choices] == ["json:sample.json"]\n',
              '    assert [choice["id"] for choice in choices] == [bundled_id]\n',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run focused regressions
        run: |
          python -m pytest -q \
            tests/test_runtime_paths.py \
            tests/test_team_identity.py \
            tests/test_team_file_organization.py \
            tests/test_league_manager.py

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/team/team_data.py tests/test_runtime_paths.py
          git commit -m "[issue-34-ci-fixed] Preserve user team override semantics"
          git push origin HEAD:feat/issue-34-stable-team-ids
