name: Branch coverage

on:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - "requirements.txt"
      - ".coveragerc"
      - ".github/workflows/branch-coverage.yml"
  push:
    branches: ["main"]
    paths:
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - "requirements.txt"
      - ".coveragerc"
      - ".github/workflows/branch-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  PYGAME_HIDE_SUPPORT_PROMPT: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  branch-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install coverage pytest
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run tests with branch coverage
        run: python -m coverage run -m pytest -q

      - name: Show missing statements and branches
        run: python -m coverage report --show-missing

      - name: Write machine-readable coverage report
        run: python -m coverage json -o coverage.json

      - name: Summarize game and developer-tool branches
        run: python -m scripts.tools.coverage_gate coverage.json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-coverage
          path: coverage.json
          if-no-files-found: warn
          retention-days: 14
