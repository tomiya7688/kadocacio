name: Godot bootstrap

on:
  push:
    branches: ["main"]
    paths: ["godot/**", "scripts/tools/godot_runner.py", "tests/test_godot_runner.py", "run_godot.bat", ".github/workflows/godot-bootstrap.yml"]
  pull_request:
    paths: ["godot/**", "scripts/tools/godot_runner.py", "tests/test_godot_runner.py", "run_godot.bat", ".github/workflows/godot-bootstrap.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: Godot_v4.7.2-stable_win64.exe.zip
            binary: Godot_v4.7.2-stable_win64_console.exe
            sha256: 731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953
          - os: ubuntu-latest
            archive: Godot_v4.7.2-stable_linux.x86_64.zip
            binary: Godot_v4.7.2-stable_linux.x86_64
            sha256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Download pinned official engine and verify checksum
        shell: pwsh
        env:
          ARCHIVE: ${{ matrix.archive }}
          BINARY: ${{ matrix.binary }}
          SHA256: ${{ matrix.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content godot/engine_version.txt -Raw).Trim()
          $archivePath = Join-Path $env:RUNNER_TEMP $env:ARCHIVE
          $engineDir = Join-Path $env:RUNNER_TEMP 'godot-engine'
          Invoke-WebRequest "https://github.com/godotengine/godot-builds/releases/download/$version-stable/$env:ARCHIVE" -OutFile $archivePath
          if ((Get-FileHash $archivePath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:SHA256) { throw 'Godot checksum mismatch' }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $engineDir
          $binaryPath = Join-Path $engineDir $env:BINARY
          if ($IsLinux) { chmod +x $binaryPath }
          "GODOT_BIN=$binaryPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Real-engine typed checks, assertions and headless lifecycle
        run: python -m scripts.tools.godot_runner test
      - name: Windowed lifecycle (Windows)
        if: runner.os == 'Windows'
        run: python -m scripts.tools.godot_runner smoke
      - name: Windowed lifecycle (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m scripts.tools.godot_runner smoke
      - name: Developer runner unit tests
        run: python -m unittest tests.test_godot_runner -v
