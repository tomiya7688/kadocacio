name: Normalize issue 66 test line endings

on:
  push:
    branches: ["fix/issue-66-left-offside"]

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[issue-66-crlf]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-66-left-offside
          fetch-depth: 0

      - name: Restore CRLF in pass logic test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_pass_logic.py")
          text = path.read_text(encoding="utf-8")
          path.write_bytes(text.replace("\r\n", "\n").replace("\n", "\r\n").encode("utf-8"))
          PY

      - name: Commit normalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_pass_logic.py
          git commit -m "[issue-66-crlf] Preserve pass logic test line endings"
          git push origin HEAD:fix/issue-66-left-offside
