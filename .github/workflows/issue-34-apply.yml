name: Clean issue 34 migration diff

on:
  push:
    branches: ["feat/issue-34-stable-team-ids"]

permissions:
  contents: write

jobs:
  clean:
    if: ${{ !contains(github.event.head_commit.message, '[issue-34-cleaned]') }}
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-34-stable-team-ids
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Replace migration writer with formatting-preserving implementation
        shell: bash
        run: |
          cat > scripts/tools/migrate_team_ids.py <<'PY'
          from __future__ import annotations

          import argparse
          import json
          import re
          from pathlib import Path

          from scripts.core.paths import (
              LEAGUES_PATH,
              LEAGUE_SAVE_DIR,
              LEAGUE_STATE_PATH,
              LEAGUE_TEMPLATE_DIR,
              PROJECT_ROOT,
              TEAMS_DIR,
          )
          from scripts.team.team_identity import (
              TEAM_ID_ALIASES_KEY,
              TEAM_ID_KEY,
              ensure_team_identity,
              legacy_team_id,
              team_id_aliases,
          )


          def _decode_json_bytes(raw: bytes) -> tuple[str, bytes]:
              bom = b"\xef\xbb\xbf" if raw.startswith(b"\xef\xbb\xbf") else b""
              body = raw[len(bom):].decode("utf-8")
              return body, bom


          def _append_root_fields(path: Path, fields: list[tuple[str, object]]) -> None:
              if not fields:
                  return
              raw = path.read_bytes()
              text, bom = _decode_json_bytes(raw)
              json.loads(text)
              newline = "\r\n" if "\r\n" in text else "\n"
              stripped_end = len(text.rstrip())
              closing = text.rfind("}", 0, stripped_end)
              if closing < 0:
                  raise ValueError(f"JSONのルート終端が見つかりません: {path}")
              before = text[:closing]
              after = text[closing:]
              trimmed = before.rstrip()
              whitespace = before[len(trimmed):]
              if trimmed.endswith("{"):
                  separator = ""
              else:
                  separator = ","
              indent_match = re.search(r"(?:\r?\n)([ \t]+)\"", text)
              indent = indent_match.group(1) if indent_match else "  "
              additions = newline.join(
                  f"{indent}{json.dumps(key, ensure_ascii=False)}: "
                  f"{json.dumps(value, ensure_ascii=False)}"
                  for key, value in fields
              )
              if whitespace:
                  inserted = trimmed + separator + whitespace + additions + newline + after
              else:
                  inserted = trimmed + separator + newline + additions + newline + after
              path.write_bytes(bom + inserted.encode("utf-8"))


          def _replace_reference_ids(path: Path, replacements: dict[str, str]) -> None:
              raw = path.read_bytes()
              text, bom = _decode_json_bytes(raw)
              json.loads(text)
              changed = text
              for old_id, new_id in replacements.items():
                  old_token = json.dumps(old_id, ensure_ascii=False)
                  new_token = json.dumps(new_id, ensure_ascii=False)
                  changed = changed.replace(old_token, new_token)
              if changed == text:
                  return
              json.loads(changed)
              path.write_bytes(bom + changed.encode("utf-8"))


          def migrate_team_tree(
              teams_root: Path,
              reference_paths: list[Path] | tuple[Path, ...] = (),
          ) -> dict[str, str]:
              """Persist permanent IDs without reformatting existing JSON files."""
              teams_root = Path(teams_root).resolve()
              replacements: dict[str, str] = {}
              records: list[tuple[Path, str, str, list[str], bool, bool]] = []
              team_id_sources: dict[str, Path] = {}

              for path in sorted(teams_root.rglob("*.json")):
                  raw = path.read_bytes()
                  text, _bom = _decode_json_bytes(raw)
                  payload = json.loads(text)
                  if not isinstance(payload, dict):
                      raise ValueError(f"チームJSONの最上位がオブジェクトではありません: {path}")
                  relative = path.relative_to(teams_root).as_posix()
                  old_id = legacy_team_id(relative)
                  had_id = bool(str(payload.get(TEAM_ID_KEY, "")).strip())
                  had_aliases = TEAM_ID_ALIASES_KEY in payload
                  team_id = ensure_team_identity(payload, legacy_id=old_id, deterministic=True)
                  aliases = team_id_aliases(payload)
                  previous = team_id_sources.get(team_id)
                  if previous is not None and previous != path:
                      raise ValueError(f"チームIDが重複しています: {team_id}: {previous} / {path}")
                  team_id_sources[team_id] = path
                  replacements[old_id] = team_id
                  records.append((path, old_id, team_id, aliases, had_id, had_aliases))

              for path, _old_id, team_id, aliases, had_id, had_aliases in records:
                  fields: list[tuple[str, object]] = []
                  if not had_id:
                      fields.append((TEAM_ID_KEY, team_id))
                  if not had_aliases:
                      fields.append((TEAM_ID_ALIASES_KEY, aliases))
                  _append_root_fields(path, fields)

              for reference in dict.fromkeys(Path(path) for path in reference_paths):
                  if reference.is_file():
                      _replace_reference_ids(reference, replacements)
              return replacements


          def default_reference_paths() -> list[Path]:
              root = PROJECT_ROOT
              paths = [
                  LEAGUES_PATH,
                  LEAGUE_STATE_PATH,
                  root / "leagues.json",
                  root / "league_state.json",
              ]
              for directory in (
                  LEAGUE_TEMPLATE_DIR,
                  LEAGUE_SAVE_DIR,
                  root / "league_templates",
                  root / "league_save",
              ):
                  if directory.is_dir():
                      paths.extend(directory.glob("*.json"))
              return list(dict.fromkeys(Path(path) for path in paths))


          def main() -> int:
              parser = argparse.ArgumentParser(description="Migrate path-based team IDs to permanent IDs")
              parser.add_argument("--teams-root", type=Path, default=TEAMS_DIR)
              parser.add_argument("--no-reference-update", action="store_true")
              args = parser.parse_args()
              references = [] if args.no_reference_update else default_reference_paths()
              replacements = migrate_team_tree(args.teams_root, references)
              print(f"Migrated {len(replacements)} team IDs")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

      - name: Restore data files and apply minimal migration
        shell: bash
        run: |
          git checkout origin/main -- teams leagues.json league_state.json
          python -m scripts.tools.migrate_team_ids

      - name: Verify migration diff shape
        shell: bash
        run: |
          python - <<'PY'
          import subprocess

          output = subprocess.check_output(
              ["git", "diff", "--numstat", "origin/main", "--", "teams"],
              text=True,
          )
          for line in output.splitlines():
              added, deleted, path = line.split("\t", 2)
              if int(added) > 8 or int(deleted) > 2:
                  raise SystemExit(f"Unexpected team JSON rewrite: {path}: +{added}/-{deleted}")
          PY

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run focused regression tests
        run: |
          python -m pytest -q \
            tests/test_team_identity.py \
            tests/test_team_file_organization.py \
            tests/test_team_metadata.py \
            tests/test_league_manager.py \
            tests/test_original_league_rosters.py

      - name: Commit cleaned migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/tools/migrate_team_ids.py teams leagues.json league_state.json
          git commit -m "[issue-34-cleaned] Preserve JSON formatting during team ID migration"
          git push origin HEAD:feat/issue-34-stable-team-ids
