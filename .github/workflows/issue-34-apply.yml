name: Clean issue 34 migration diff

on:
  push:
    branches: ["feat/issue-34-stable-team-ids"]

permissions:
  contents: write

jobs:
  clean:
    if: ${{ !contains(github.event.head_commit.message, '[issue-34-cleaned]') }}
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-34-stable-team-ids
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Restore data files and apply minimal migration
        shell: bash
        run: |
          git checkout origin/main -- teams leagues.json league_state.json
          python -m scripts.tools.migrate_team_ids

      - name: Verify migration diff shape
        shell: bash
        run: |
          python - <<'PY'
          import subprocess

          output = subprocess.check_output(
              ["git", "diff", "--numstat", "origin/main", "--", "teams"],
              text=True,
          )
          for line in output.splitlines():
              added, deleted, path = line.split("\t", 2)
              if int(added) > 8 or int(deleted) > 2:
                  raise SystemExit(f"Unexpected team JSON rewrite: {path}: +{added}/-{deleted}")
          PY

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run focused regression tests
        run: |
          python -m pytest -q \
            tests/test_team_identity.py \
            tests/test_team_file_organization.py \
            tests/test_team_metadata.py \
            tests/test_league_manager.py \
            tests/test_original_league_rosters.py

      - name: Commit cleaned migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/tools/migrate_team_ids.py teams leagues.json league_state.json
          git commit -m "[issue-34-cleaned] Preserve JSON formatting during team ID migration"
          git push origin HEAD:feat/issue-34-stable-team-ids
