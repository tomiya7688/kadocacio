name: Apply issue 66 patch

on:
  push:
    branches: ["fix/issue-66-left-offside"]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[issue-66-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-66-left-offside
          fetch-depth: 0

      - name: Apply direction-aware offside fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/match/match_engine.py")
          text = path.read_text(encoding="utf-8")
          old = """    forward_progress = attacker_x - passer_x\n    if forward_progress <= 0.0:\n        return False\n"""
          new = """    forward_progress = (attacker_x - passer_x) * team_direction\n    if forward_progress <= 0.0:\n        return False\n"""
          if text.count(old) != 1:
              raise SystemExit(f"expected one offside progress block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/match/match_engine.py
          git commit -m "[issue-66-patched] Fix direction-aware offside progress"
          git push origin HEAD:fix/issue-66-left-offside
