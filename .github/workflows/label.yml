# This workflow labels pull requests only when a labeler configuration exists.
# Keeping the workflow tolerant of a missing config prevents unrelated PRs from
# going red because repository metadata automation is not configured yet.

name: Labeler
on: [pull_request_target]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out base branch
        uses: actions/checkout@v4

      - name: Apply labels
        if: ${{ hashFiles('.github/labeler.yml') != '' }}
        uses: actions/labeler@v4
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Skip when labeler config is absent
        if: ${{ hashFiles('.github/labeler.yml') == '' }}
        run: echo "No .github/labeler.yml found; skipping PR labeling."
