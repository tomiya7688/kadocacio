name: Apply issue 35 fix

on:
  push:
    branches: ["fix/issue-35-save-format-migrations"]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[issue-35-applied]') }}
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-35-save-format-migrations
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Wire format migrations into league saves
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/league/league_manager.py")
          text = path.read_text(encoding="utf-8")

          old = '''from scripts.league.league_simulation_session import LeagueSimulationSession\nfrom scripts.league.league_simulation_workers import (\n'''
          new = '''from scripts.league.league_simulation_session import LeagueSimulationSession\nfrom scripts.league.save_migrations import (\n    CURRENT_FORMAT_VERSION,\n    SaveFormatError,\n    migrate_save_payload,\n)\nfrom scripts.league.league_simulation_workers import (\n'''
          if text.count(old) != 1:
              raise SystemExit("migration import marker not found exactly once")
          text = text.replace(old, new, 1)

          old = '''    def _default_save_path(self) -> Path:\n        return LEAGUE_SAVE_DIR / f"{DEFAULT_SAVE_NAME}.json"\n\n    def _apply_state(self, state: dict) -> None:\n'''
          new = '''    def _default_save_path(self) -> Path:\n        return LEAGUE_SAVE_DIR / f"{DEFAULT_SAVE_NAME}.json"\n\n    @staticmethod\n    def _backup_before_migration(target: Path, source_version: int) -> Path:\n        backup = target.with_name(f"{target.name}.v{source_version}.bak")\n        if not backup.exists():\n            shutil.copy2(target, backup)\n        return backup\n\n    def _apply_state(self, state: dict) -> None:\n'''
          if text.count(old) != 1:
              raise SystemExit("backup insertion marker not found exactly once")
          text = text.replace(old, new, 1)

          old = '''        if not isinstance(state, dict):\n            self.last_load_error = "セーブデータを読み込めません: JSONの一番外側がオブジェクトではありません"\n            self.failed_save_path = target\n            return False\n\n        try:\n            self._apply_state(state)\n        except Exception as error:\n            # Save migrations and schema conversions run behind the same safety\n            # boundary: a failed migration must not make the source overwritable.\n            self.last_load_error = f"セーブデータを適用できません: {error}"\n            self.failed_save_path = target\n            return False\n'''
          new = '''        try:\n            state, source_version = migrate_save_payload(state)\n            if source_version < CURRENT_FORMAT_VERSION:\n                self._backup_before_migration(target, source_version)\n            self._apply_state(state)\n        except SaveFormatError as error:\n            self.last_load_error = f"セーブ形式に互換性がありません: {error}"\n            self.failed_save_path = target\n            return False\n        except Exception as error:\n            # Save migrations and schema conversions run behind the same safety\n            # boundary: a failed migration must not make the source overwritable.\n            self.last_load_error = f"セーブデータを適用できません: {error}"\n            self.failed_save_path = target\n            return False\n'''
          if text.count(old) != 1:
              raise SystemExit("load migration block not found exactly once")
          text = text.replace(old, new, 1)

          old = '''        return {\n            "save_version": SAVE_VERSION,\n'''
          new = '''        return {\n            "format_version": CURRENT_FORMAT_VERSION,\n            "save_version": SAVE_VERSION,\n'''
          if text.count(old) != 1:
              raise SystemExit("state payload marker not found exactly once")
          text = text.replace(old, new, 1)

          old = '''                if not isinstance(loaded, dict):\n                    errors.append("JSONの一番外側がオブジェクトではありません")\n                else:\n                    state = loaded\n'''
          new = '''                try:\n                    state, _source_version = migrate_save_payload(loaded)\n                except SaveFormatError as error:\n                    errors.append(f"セーブ形式に互換性がありません: {error}")\n                    state = {}\n'''
          if text.count(old) != 1:
              raise SystemExit("list saves migration block not found exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Add version entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("doc/versions.md")
          text = path.read_text(encoding="utf-8")
          marker = "---\n\nver 0.7.4\n"
          lines = [
              "---", "", "ver 0.7.5", "", "リーグセーブ形式のバージョン管理と安全マイグレーション", "",
              "追加したファイル", "", "- `scripts/league/save_migrations.py`", "",
              "  format_version判定、v0からv1への移行、現行形式の最小スキーマ検証を担当します。", "",
              "- `tests/test_save_migrations.py`", "",
              "  旧形式移行、バックアップ、未来バージョン拒否、形式検証を回帰テストします。", "",
              "変更したファイル", "", "- `scripts/league/league_manager.py`", "",
              "  保存時にformat_version=1を書き込み、旧形式はバックアップ後に移行し、未来形式は元データを変更せず拒否します。", "",
              "- `doc/versions.md`", "", "  ver 0.7.5の変更内容を追記しました。", "", "---", "", "ver 0.7.4", "",
          ]
          entry = "\n".join(lines)
          if text.count(marker) != 1:
              raise SystemExit("version insertion marker not found exactly once")
          path.write_text(text.replace(marker, entry, 1), encoding="utf-8")
          PY

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt pytest

      - name: Run save migration regression tests
        run: |
          python -m pytest -q tests/test_save_migrations.py tests/test_league_manager.py

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/league/league_manager.py doc/versions.md
          git commit -m "[issue-35-applied] Add safe save format migrations"
          git push origin HEAD:fix/issue-35-save-format-migrations
